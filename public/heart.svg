<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#e7f0ff"/>
      <stop offset="100%" stop-color="#cfe0ff"/>
    </radialGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a9c7ff"/>
      <stop offset="50%" stop-color="#7aa7ff"/>
      <stop offset="100%" stop-color="#b18cff"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="8" result="offsetBlur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bgGrad)"/>

  <!-- subtle background sparkles -->
  <g opacity="0.55" fill="#ffffff">
    <circle cx="60"  cy="80"  r="3"/>
    <circle cx="120" cy="40"  r="2"/>
    <circle cx="540" cy="70"  r="3"/>
    <circle cx="480" cy="30"  r="2"/>
    <circle cx="40"  cy="540" r="2.5"/>
    <circle cx="560" cy="520" r="3"/>
    <circle cx="510" cy="560" r="2"/>
    <circle cx="80"  cy="500" r="2"/>
  </g>

  <!-- stars -->
  <g fill="#ffffff" opacity="0.85">
    <path d="M90,160 l4,12 l12,4 l-12,4 l-4,12 l-4,-12 l-12,-4 l12,-4 z"/>
    <path d="M510,180 l3,9 l9,3 l-9,3 l-3,9 l-3,-9 l-9,-3 l9,-3 z"/>
    <path d="M120,460 l3,9 l9,3 l-9,3 l-3,9 l-3,-9 l-9,-3 l9,-3 z"/>
    <path d="M490,440 l4,12 l12,4 l-12,4 l-4,12 l-4,-12 l-12,-4 l12,-4 z"/>
  </g>

  <!-- heart -->
  <g filter="url(#softShadow)">
    <path
      d="M300 500
         C 120 380, 80 260, 160 190
         C 220 135, 280 165, 300 215
         C 320 165, 380 135, 440 190
         C 520 260, 480 380, 300 500 Z"
      fill="url(#heartGrad)"
      stroke="#ffffff"
      stroke-width="4"
      stroke-linejoin="round"
    />
    <!-- highlight -->
    <path
      d="M210 210
         C 200 240, 215 270, 240 280
         C 220 250, 220 225, 235 205
         C 225 200, 215 203, 210 210 Z"
      fill="url(#shineGrad)"
      opacity="0.9"
    />
  </g>

  <!-- name -->
  <text x="300" y="335"
        text-anchor="middle"
        font-family="'Caveat', 'Brush Script MT', cursive"
        font-size="86"
        font-weight="700"
        fill="#ffffff"
        style="paint-order: stroke; stroke: rgba(80,110,200,0.35); stroke-width: 3;">
    Айзирек
  </text>
  <text x="300" y="385"
        text-anchor="middle"
        font-family="'Nunito', system-ui, sans-serif"
        font-size="22"
        font-weight="600"
        letter-spacing="6"
        fill="#ffffff"
        opacity="0.9">
    МОЁ ЧУДО
  </text>

  <!-- tiny hearts around -->
  <g fill="#ffffff" opacity="0.8">
    <path d="M180 110 c-4,-6 -14,-6 -14,2 c0,8 14,16 14,16 c0,0 14,-8 14,-16 c0,-8 -10,-8 -14,-2 z"/>
    <path d="M430 100 c-3,-5 -11,-5 -11,2 c0,6 11,12 11,12 c0,0 11,-6 11,-12 c0,-7 -8,-7 -11,-2 z"/>
  </g>
</svg>
